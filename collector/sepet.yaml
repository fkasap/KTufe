# =============================================================================
# Web TÜFE replikası — 13 ana grubu kapsayan başlangıç sepeti (gerçek kaynaklar)
# =============================================================================
# Her madde: TÜİK COICOP-2018 kodu + 2026 ağırlığı (ana grup ağırlıkları EVDS'den
# kesin; madde ağırlıkları TÜİK'in 428 maddelik dosyası elle eklenene kadar
# ana grup içi yaklaşık paylardır -> `agirlik_durum: yaklasik`).
#
# Kaynak türleri ve DOĞRULAMA DURUMU (26.10.2026):
#   marketfiyati  Sanayi ve Teknoloji Bakanlığı "Market Fiyatı" platformu, kamu
#                 verisi, zincir marketlerin günlük fiyatları. API şeması açık
#                 kaynak istemciden; canlı test bu oturumda yapılamadı.
#   petrolofisi   81 il statik HTML, KDV dahil fiyat. Sayfa içeriği doğrulandı.
#   evds          TÜİK alt endeksleri (TCMB EVDS, anahtar gerekir). Seri kodları
#                 doğrulandı (bie_tukfiy2025, 349 seri).
#   ibb_hal       İBB Açık Veri CKAN; resource_id portaldan elle alınacak.
#   playwright    JS-render sayfalar; pattern'ler ilk çalıştırmada ayarlanır.
#
# Market Fiyatı'nda product_id'yi şöyle bulun: platformda ürünü arayın, URL'deki
# kimliği (ya da API yanıtındaki content[].id) kopyalayın. keywords yalnızca
# yedek; SKU sabitliği için product_id şart.
# =============================================================================

defaults:
  lat: 41.03          # İstanbul merkez; TÜİK 81 il ağırlıklı, İstanbul ~%25
  lon: 28.98
  distance: 15000

