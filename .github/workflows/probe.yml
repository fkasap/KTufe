name: Kaynak erişim sondası
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python scripts/probe_sources.py && python scripts/probe_deep.py
      - run: |
          git config user.name ktufe-bot; git config user.email ktufe-bot@users.noreply.github.com
          git add reports; git diff --cached --quiet && exit 0
          git commit -m "probe: kaynak erişim sondası $(date -u +%F)"; git pull --rebase origin main; git push
