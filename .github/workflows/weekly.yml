name: Haftalık TÜFE hesabı

on:
  schedule:
    - cron: "0 5 * * 1"       # Pazartesi 08:00 TR — hafta sonu verisi dahil
  workflow_dispatch:

concurrency:
  group: ktufe-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Motor doğrulaması (TÜİK ile tutarlılık testi)
        run: python engine/validate_tuik.py > /dev/null
      - name: Endeksi hesapla ve raporu üret
        run: python scripts/build_index.py
      - name: README'ye özeti göm
        run: |
          python - <<'EOF'
          import re, pathlib
          r = pathlib.Path("README.md").read_text(encoding="utf-8")
          s = pathlib.Path("reports/latest.md").read_text(encoding="utf-8")
          block = "<!-- OZET:BASLA -->\n" + s + "\n<!-- OZET:BITIR -->"
          if "<!-- OZET:BASLA -->" in r:
              r = re.sub(r"<!-- OZET:BASLA -->.*?<!-- OZET:BITIR -->", block, r, flags=re.S)
          else:
              r += "\n\n" + block + "\n"
          pathlib.Path("README.md").write_text(r, encoding="utf-8")
          EOF
      - name: Commit
        run: |
          git config user.name "ktufe-bot"
          git config user.email "ktufe-bot@users.noreply.github.com"
          git add data/index reports README.md
          git diff --cached --quiet && exit 0
          git commit -m "index: haftalık hesap $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
